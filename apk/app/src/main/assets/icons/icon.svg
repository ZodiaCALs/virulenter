<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Virulenter"><defs>
      <radialGradient id="t-hf" gradientUnits="userSpaceOnUse" cx="256" cy="200" r="400">
        <stop offset="0" stop-color="#0E3D29"/><stop offset=".55" stop-color="#062016"/><stop offset="1" stop-color="#020A06"/>
      </radialGradient>
      <radialGradient id="t-hl" gradientUnits="userSpaceOnUse" cx="330" cy="340" r="260">
        <stop offset="0" stop-color="#1FB86E" stop-opacity=".46"/><stop offset="1" stop-color="#1FB86E" stop-opacity="0"/>
      </radialGradient>
      <pattern id="t-hg" width="32" height="32" patternUnits="userSpaceOnUse" x="0" y="0">
        <path d="M32 0H0V32" fill="none" stroke="#9CF5C6" stroke-opacity=".11" stroke-width="1.2"/>
      </pattern>
      <radialGradient id="t-hm" gradientUnits="userSpaceOnUse" cx="256" cy="256" r="340">
        <stop offset=".3" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
      </radialGradient>
      <mask id="t-hk" maskUnits="userSpaceOnUse" x="-256" y="-256" width="1024" height="1024"><rect x="-256" y="-256" width="1024" height="1024" fill="url(#t-hm)"/></mask>
      <linearGradient id="t-hs" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="512" y2="512">
        <stop offset="0" stop-color="#fff" stop-opacity=".08"/><stop offset=".42" stop-color="#fff" stop-opacity="0"/>
      </linearGradient>
    </defs><defs><clipPath id="t-clip"><rect width="512" height="512" rx="112"/></clipPath></defs>
      <g clip-path="url(#t-clip)">
    
    <rect x="-256" y="-256" width="1024" height="1024" fill="url(#t-hf)"/>
    <rect x="-256" y="-256" width="1024" height="1024" fill="url(#t-hl)"/>
    <rect x="-256" y="-256" width="1024" height="1024" fill="url(#t-hg)" mask="url(#t-hk)"/>
    <rect x="-256" y="-256" width="1024" height="1024" fill="url(#t-hs)"/>
    <defs>
      <clipPath id="t-hc"><rect x="100" y="100" width="92" height="92" rx="26" /><rect x="210" y="100" width="92" height="92" rx="26" /><rect x="320" y="100" width="92" height="92" rx="26" /><rect x="100" y="210" width="92" height="92" rx="26" /><rect x="210" y="210" width="92" height="92" rx="26" /><rect x="320" y="210" width="92" height="92" rx="26" /><rect x="100" y="320" width="92" height="92" rx="26" /><rect x="210" y="320" width="92" height="92" rx="26" /><circle cx="366" cy="366" r="50"/></clipPath>
      <filter id="t-hfrost" x="-5%" y="-5%" width="110%" height="110%">
        <feGaussianBlur stdDeviation="7"/>
        <feComponentTransfer>
          <feFuncR type="linear" slope="1.12" intercept=".01"/><feFuncG type="linear" slope="1.14" intercept=".015"/><feFuncB type="linear" slope="1.1" intercept=".01"/>
        </feComponentTransfer>
      </filter>
      <filter id="t-hbloom" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="17"/></filter>
      <filter id="t-hsoft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="8"/></filter>
      <filter id="t-htight" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="2.6"/></filter>
      
      <linearGradient id="t-ht1" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#C2FFDD" stop-opacity="0.06"/><stop offset="1" stop-color="#2FD583" stop-opacity="0.03"/>
      </linearGradient>
      <linearGradient id="t-ht2" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#C2FFDD" stop-opacity="0.12"/><stop offset="1" stop-color="#2FD583" stop-opacity="0.11"/>
      </linearGradient>
      <linearGradient id="t-ht3" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#C2FFDD" stop-opacity="0.22"/><stop offset="1" stop-color="#2FD583" stop-opacity="0.27"/>
      </linearGradient>
      <linearGradient id="t-ht4" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#7CFFB5" stop-opacity="0.38"/><stop offset="1" stop-color="#2FD583" stop-opacity="0.52"/>
      </linearGradient>
      <linearGradient id="t-ht5" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#7CFFB5" stop-opacity="0.6"/><stop offset="1" stop-color="#2FD583" stop-opacity="0.8"/>
      </linearGradient>
      <radialGradient id="t-hin" cx=".5" cy="1.05" r=".75">
        <stop offset="0" stop-color="#7CFFB5" stop-opacity=".55"/><stop offset="1" stop-color="#7CFFB5" stop-opacity="0"/>
      </radialGradient>
      <linearGradient id="t-hgloss" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#fff" stop-opacity=".2"/><stop offset=".3" stop-color="#fff" stop-opacity=".03"/><stop offset=".31" stop-color="#fff" stop-opacity="0"/>
      </linearGradient>
      <!-- a diagonal reflection across each pane: the cue that says glass -->
      <linearGradient id="t-hband" x1="0" y1="0" x2="1" y2="1">
        <stop offset=".22" stop-color="#fff" stop-opacity="0"/><stop offset=".24" stop-color="#fff" stop-opacity=".13"/>
        <stop offset=".36" stop-color="#fff" stop-opacity=".07"/><stop offset=".38" stop-color="#fff" stop-opacity="0"/>
        <stop offset=".44" stop-color="#fff" stop-opacity="0"/><stop offset=".45" stop-color="#fff" stop-opacity=".08"/>
        <stop offset=".48" stop-color="#fff" stop-opacity="0"/>
      </linearGradient>
      <linearGradient id="t-hrim" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#fff" stop-opacity=".95"/><stop offset=".36" stop-color="#fff" stop-opacity=".14"/>
        <stop offset=".72" stop-color="#fff" stop-opacity=".05"/><stop offset="1" stop-color="#7CFFB5" stop-opacity=".6"/>
      </linearGradient>
      <radialGradient id="t-horb" cx=".42" cy=".38" r=".75">
        <stop offset="0" stop-color="#2FD583" stop-opacity=".95"/><stop offset=".62" stop-color="#139B5B" stop-opacity=".92"/>
        <stop offset="1" stop-color="#0A6B3F" stop-opacity=".96"/>
      </radialGradient>
      <linearGradient id="t-hcres" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#fff" stop-opacity=".6"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
      </linearGradient>
    </defs>
    <!-- light the hot panes throw onto the field -->
    <g filter="url(#t-hbloom)">
      <rect x="320" y="100" width="92" height="92" rx="26" fill="#2FD583" fill-opacity="0.22"/><rect x="210" y="210" width="92" height="92" rx="26" fill="#2FD583" fill-opacity="0.22"/><rect x="320" y="210" width="92" height="92" rx="26" fill="#2FD583" fill-opacity="0.44"/><rect x="100" y="320" width="92" height="92" rx="26" fill="#2FD583" fill-opacity="0.22"/><rect x="210" y="320" width="92" height="92" rx="26" fill="#2FD583" fill-opacity="0.66"/>
      <circle cx="366" cy="366" r="58" fill="#7CFFB5" fill-opacity=".62"/>
    </g>
    <!-- depth: every pane casts a soft shadow -->
    <g filter="url(#t-hsoft)" fill="#000" fill-opacity=".5">
      <rect x="100" y="109" width="92" height="92" rx="26"/><rect x="210" y="109" width="92" height="92" rx="26"/><rect x="320" y="109" width="92" height="92" rx="26"/><rect x="100" y="219" width="92" height="92" rx="26"/><rect x="210" y="219" width="92" height="92" rx="26"/><rect x="320" y="219" width="92" height="92" rx="26"/><rect x="100" y="329" width="92" height="92" rx="26"/><rect x="210" y="329" width="92" height="92" rx="26"/>
      <circle cx="366" cy="376" r="50"/>
    </g>
    <!-- the frost: the field behind each pane, blurred and brightened -->
    <g clip-path="url(#t-hc)"><g filter="url(#t-hfrost)">
    
    <rect x="-256" y="-256" width="1024" height="1024" fill="url(#t-hf)"/>
    <rect x="-256" y="-256" width="1024" height="1024" fill="url(#t-hl)"/>
    <rect x="-256" y="-256" width="1024" height="1024" fill="url(#t-hg)" mask="url(#t-hk)"/>
    <rect x="-256" y="-256" width="1024" height="1024" fill="url(#t-hs)"/></g></g>
    <!-- heat, as light held in the glass -->
    <rect x="100" y="100" width="92" height="92" rx="26" fill="url(#t-ht1)"/><rect x="210" y="100" width="92" height="92" rx="26" fill="url(#t-ht2)"/><rect x="320" y="100" width="92" height="92" rx="26" fill="url(#t-ht3)"/><rect x="100" y="210" width="92" height="92" rx="26" fill="url(#t-ht2)"/><rect x="210" y="210" width="92" height="92" rx="26" fill="url(#t-ht3)"/><rect x="320" y="210" width="92" height="92" rx="26" fill="url(#t-ht4)"/><rect x="100" y="320" width="92" height="92" rx="26" fill="url(#t-ht3)"/><rect x="210" y="320" width="92" height="92" rx="26" fill="url(#t-ht5)"/>
    <rect x="320" y="100" width="92" height="92" rx="26" fill="url(#t-hin)" fill-opacity="0.33"/><rect x="210" y="210" width="92" height="92" rx="26" fill="url(#t-hin)" fill-opacity="0.33"/><rect x="320" y="210" width="92" height="92" rx="26" fill="url(#t-hin)" fill-opacity="0.67"/><rect x="100" y="320" width="92" height="92" rx="26" fill="url(#t-hin)" fill-opacity="0.33"/><rect x="210" y="320" width="92" height="92" rx="26" fill="url(#t-hin)" fill-opacity="1.00"/>
    <!-- the hottest panes glow at their inner edge, like lit acrylic -->
    <g fill="none" stroke="#7CFFB5" stroke-width="3" filter="url(#t-htight)">
      <rect x="324" y="214" width="84" height="84" rx="22" stroke-opacity="0.4"/><rect x="214" y="324" width="84" height="84" rx="22" stroke-opacity="0.7"/>
    </g>
    <!-- gloss, a diagonal reflection, then the lit rim -->
    <rect x="102" y="102" width="88" height="88" rx="24" fill="url(#t-hgloss)"/><rect x="212" y="102" width="88" height="88" rx="24" fill="url(#t-hgloss)"/><rect x="322" y="102" width="88" height="88" rx="24" fill="url(#t-hgloss)"/><rect x="102" y="212" width="88" height="88" rx="24" fill="url(#t-hgloss)"/><rect x="212" y="212" width="88" height="88" rx="24" fill="url(#t-hgloss)"/><rect x="322" y="212" width="88" height="88" rx="24" fill="url(#t-hgloss)"/><rect x="102" y="322" width="88" height="88" rx="24" fill="url(#t-hgloss)"/><rect x="212" y="322" width="88" height="88" rx="24" fill="url(#t-hgloss)"/>
    <rect x="100" y="100" width="92" height="92" rx="26" fill="url(#t-hband)"/><rect x="210" y="100" width="92" height="92" rx="26" fill="url(#t-hband)"/><rect x="320" y="100" width="92" height="92" rx="26" fill="url(#t-hband)"/><rect x="100" y="210" width="92" height="92" rx="26" fill="url(#t-hband)"/><rect x="210" y="210" width="92" height="92" rx="26" fill="url(#t-hband)"/><rect x="320" y="210" width="92" height="92" rx="26" fill="url(#t-hband)"/><rect x="100" y="320" width="92" height="92" rx="26" fill="url(#t-hband)"/><rect x="210" y="320" width="92" height="92" rx="26" fill="url(#t-hband)"/>
    <rect x="101" y="101" width="90" height="90" rx="25" fill="none" stroke="url(#t-hrim)" stroke-width="2"/><rect x="211" y="101" width="90" height="90" rx="25" fill="none" stroke="url(#t-hrim)" stroke-width="2"/><rect x="321" y="101" width="90" height="90" rx="25" fill="none" stroke="url(#t-hrim)" stroke-width="2"/><rect x="101" y="211" width="90" height="90" rx="25" fill="none" stroke="url(#t-hrim)" stroke-width="2"/><rect x="211" y="211" width="90" height="90" rx="25" fill="none" stroke="url(#t-hrim)" stroke-width="2"/><rect x="321" y="211" width="90" height="90" rx="25" fill="none" stroke="url(#t-hrim)" stroke-width="2"/><rect x="101" y="321" width="90" height="90" rx="25" fill="none" stroke="url(#t-hrim)" stroke-width="2"/><rect x="211" y="321" width="90" height="90" rx="25" fill="none" stroke="url(#t-hrim)" stroke-width="2"/>
    <!-- the orb: deep glass lit from within, and its HUD ring -->
    <circle cx="366" cy="366" r="50" fill="url(#t-horb)"/>
    <ellipse cx="357" cy="341" rx="31" ry="15" fill="url(#t-hcres)" filter="url(#t-htight)"/>
    <circle cx="366" cy="366" r="49" fill="none" stroke="url(#t-hrim)" stroke-width="2"/>
    <g fill="#C2FFDD" filter="url(#t-htight)" opacity=".9"><rect x="343" y="359.5" width="46" height="13" rx="6.5"/><rect x="359.5" y="343" width="13" height="46" rx="6.5"/></g>
    <g fill="#fff"><rect x="345" y="360.5" width="42" height="11" rx="5.5"/><rect x="360.5" y="345" width="11" height="42" rx="5.5"/></g>
    <g fill="none" stroke="#7CFFB5" stroke-linecap="round">
      <path d="M417.61 329.86A63 63 0 1 1 308.9 339.38" stroke-width="2.4" stroke-opacity=".55"/>
      <path d="M319.18 323.84A63 63 0 0 1 397.5 311.44" stroke-width="2.4" stroke-opacity=".28"/>
    </g>
    <!-- viewfinder brackets frame the grid; the orb holds the fourth corner -->
    <g fill="none" stroke="#7CFFB5" stroke-opacity=".5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M84 108V84H108"/><path d="M428 108V84H404"/><path d="M84 404V428H108"/>
    </g></g></svg>
