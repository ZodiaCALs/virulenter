# Signing for the release APK.
#
# This keystore was generated for this project so that `--release` produces an
# installable, upgradeable APK with no extra setup. The password is public and
# the key is therefore not secret — fine for sideloading your own builds, but
# generate your own before publishing anywhere:
#
#   keytool -genkeypair -v -keystore apk/my-release.jks -alias mykey \
#           -keyalg RSA -keysize 2048 -validity 10950
#
# then point storeFile/storePassword/keyAlias/keyPassword at it.
storeFile=virulenter-release.jks
storePassword=virulenter
keyAlias=virulenter
keyPassword=virulenter
