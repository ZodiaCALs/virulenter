<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Virulenter">
  <defs>
    <linearGradient id="fv-base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8a6cff"/>
      <stop offset=".4" stop-color="#5233e4"/>
      <stop offset=".76" stop-color="#26137f"/>
      <stop offset="1" stop-color="#120840"/>
    </linearGradient>
    <radialGradient id="fv-cyan">
      <stop offset="0" stop-color="#6ff5ff"/>
      <stop offset=".5" stop-color="#2fb4ff" stop-opacity=".75"/>
      <stop offset="1" stop-color="#2f7dff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="fv-pink">
      <stop offset="0" stop-color="#ff7ad9"/>
      <stop offset=".5" stop-color="#d63ad0" stop-opacity=".75"/>
      <stop offset="1" stop-color="#a21caf" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="fv-amber">
      <stop offset="0" stop-color="#ffc98a"/>
      <stop offset=".55" stop-color="#ff8a5c" stop-opacity=".5"/>
      <stop offset="1" stop-color="#ff6a5c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fv-sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#fff" stop-opacity=".9"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="fv-soft" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="42"/></filter>
    <filter id="fv-haze" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="22"/></filter>

    <!-- what the glass does to the light behind it -->
    <filter id="fv-lens" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="9"/>
      <feColorMatrix type="saturate" values="1.55"/>
      <feComponentTransfer>
        <feFuncR type="linear" slope="1.1" intercept=".12"/>
        <feFuncG type="linear" slope="1.1" intercept=".12"/>
        <feFuncB type="linear" slope="1.05" intercept=".12"/>
      </feComponentTransfer>
    </filter>

    <!-- the V as a mask, and directional bands along its edges -->
    <mask id="fv-v" maskUnits="userSpaceOnUse" x="0" y="0" width="512" height="512">
      <polyline points="148,156 256,360 364,156" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke="#fff" stroke-width="66"/>
    </mask>
    <mask id="fv-rimLit" maskUnits="userSpaceOnUse" x="0" y="0" width="512" height="512">
      <polyline points="148,156 256,360 364,156" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke="#fff" stroke-width="66"/>
      <g transform="translate(5 7)"><polyline points="148,156 256,360 364,156" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke="#000" stroke-width="66"/></g>
    </mask>
    <mask id="fv-rimDeep" maskUnits="userSpaceOnUse" x="0" y="0" width="512" height="512">
      <polyline points="148,156 256,360 364,156" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke="#fff" stroke-width="66"/>
      <g transform="translate(-7 -10)"><polyline points="148,156 256,360 364,156" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke="#000" stroke-width="66"/></g>
    </mask>
    <mask id="fv-rimLine" maskUnits="userSpaceOnUse" x="0" y="0" width="512" height="512">
      <g transform="translate(-4 -6)"><polyline points="148,156 256,360 364,156" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke="#fff" stroke-width="66"/></g>
      <g transform="translate(-6.5 -9.5)"><polyline points="148,156 256,360 364,156" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke="#000" stroke-width="66"/></g>
    </mask>
    <mask id="fv-edge" maskUnits="userSpaceOnUse" x="0" y="0" width="512" height="512">
      <polyline points="148,156 256,360 364,156" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke="#fff" stroke-width="66"/>
      <polyline points="148,156 256,360 364,156" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke="#000" stroke-width="63"/>
    </mask>

    <linearGradient id="fv-tint" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".84"/>
      <stop offset=".5" stop-color="#f4f1ff" stop-opacity=".4"/>
      <stop offset="1" stop-color="#e4ddff" stop-opacity=".6"/>
    </linearGradient>
    <linearGradient id="fv-lit" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff"/>
      <stop offset=".55" stop-color="#fff" stop-opacity=".75"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".25"/>
    </linearGradient>
    <linearGradient id="fv-deep" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b1fb0" stop-opacity=".1"/>
      <stop offset="1" stop-color="#2a1490" stop-opacity=".42"/>
    </linearGradient>
    <linearGradient id="fv-streak" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".95"/>
      <stop offset=".55" stop-color="#fff" stop-opacity=".45"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fv-caustic" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5ff0ff"/>
      <stop offset=".5" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ff7ad9"/>
    </linearGradient>
    <filter id="fv-shadow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="15"/></filter>
    <filter id="fv-glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="20"/></filter>
    <filter id="fv-fine" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="1.6"/></filter>
    <filter id="fv-glint" x="-200%" y="-200%" width="500%" height="500%"><feGaussianBlur stdDeviation="3.2"/></filter>

    <!-- the drop -->
    <clipPath id="fv-drop"><circle cx="256" cy="196" r="31"/></clipPath>
    <radialGradient id="fv-dropBody" cx=".38" cy=".32" r=".75">
      <stop offset="0" stop-color="#fff" stop-opacity=".55"/>
      <stop offset=".45" stop-color="#fff" stop-opacity=".12"/>
      <stop offset=".85" stop-color="#2a1385" stop-opacity=".25"/>
      <stop offset="1" stop-color="#140846" stop-opacity=".55"/>
    </radialGradient>
    <radialGradient id="fv-dropCaustic" cx=".68" cy=".78" r=".38">
      <stop offset="0" stop-color="#bff8ff" stop-opacity=".95"/>
      <stop offset="1" stop-color="#bff8ff" stop-opacity="0"/>
    </radialGradient>

    <!-- the tile as a slab of glass -->
    <linearGradient id="fv-gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".42"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fv-rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".9"/>
      <stop offset=".4" stop-color="#fff" stop-opacity=".16"/>
      <stop offset=".75" stop-color="#fff" stop-opacity=".08"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".4"/>
    </linearGradient>
    <clipPath id="fv-tile"><rect width="512" height="512" rx="116"/></clipPath>
  </defs>
  <g clip-path="url(#fv-tile)">
    <rect width="512" height="512" fill="url(#fv-base)"/>
    <g filter="url(#fv-soft)">
      <ellipse cx="430" cy="92" rx="220" ry="176" fill="url(#fv-cyan)"/>
      <ellipse cx="62" cy="452" rx="236" ry="196" fill="url(#fv-pink)"/>
      <ellipse cx="470" cy="500" rx="170" ry="120" fill="url(#fv-cyan)" opacity=".35"/>
    </g>
    <g filter="url(#fv-haze)" opacity=".22">
      <ellipse cx="200" cy="150" rx="300" ry="34" fill="url(#fv-sheen)" transform="rotate(-28 200 150)"/>
    </g>
    <g transform="translate(0 20)" filter="url(#fv-shadow)" opacity=".5">
      <polyline points="148,156 256,360 364,156" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke="#0a0430" stroke-width="66"/>
    </g>
    <g transform="translate(0 38)" filter="url(#fv-glow)" opacity=".5" style="mix-blend-mode:screen">
      <polyline points="148,156 256,360 364,156" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke="url(#fv-caustic)" stroke-width="46.199999999999996"/>
    </g>
    <g mask="url(#fv-v)">
      <g filter="url(#fv-lens)" transform="translate(256 262) scale(1.22) translate(-256 -262)">
    <rect width="512" height="512" fill="url(#fv-base)"/>
    <g filter="url(#fv-soft)">
      <ellipse cx="430" cy="92" rx="220" ry="176" fill="url(#fv-cyan)"/>
      <ellipse cx="62" cy="452" rx="236" ry="196" fill="url(#fv-pink)"/>
      <ellipse cx="470" cy="500" rx="170" ry="120" fill="url(#fv-cyan)" opacity=".35"/>
    </g>
    <g filter="url(#fv-haze)" opacity=".22">
      <ellipse cx="200" cy="150" rx="300" ry="34" fill="url(#fv-sheen)" transform="rotate(-28 200 150)"/>
    </g></g>
      <rect width="512" height="512" fill="url(#fv-tint)"/>
    </g>
    <rect width="512" height="512" fill="url(#fv-deep)" mask="url(#fv-rimDeep)"/>
    <rect width="512" height="512" fill="#9df3ff" opacity=".7" mask="url(#fv-rimLine)"/>
    <rect width="512" height="512" fill="url(#fv-lit)" mask="url(#fv-rimLit)"/>
    <rect width="512" height="512" fill="#fff" opacity=".5" mask="url(#fv-edge)"/>
    <g filter="url(#fv-fine)">
      <polyline points="154,154 248,326" fill="none"
                stroke="url(#fv-streak)" stroke-width="9" stroke-linecap="round"/>
      <polyline points="356,164 330,214" fill="none"
                stroke="#fff" stroke-opacity=".45" stroke-width="5" stroke-linecap="round"/>
    </g>
    <circle cx="142" cy="147" r="7" fill="#fff" filter="url(#fv-glint)"/>
    <circle cx="142" cy="147" r="3" fill="#fff"/>
    <ellipse cx="256" cy="241" rx="21.7" ry="6" fill="#0a0430" opacity=".22" filter="url(#fv-glint)"/>
    <g clip-path="url(#fv-drop)">
      <g filter="url(#fv-lens)" transform="translate(256 196) scale(-1.6 -1.6) translate(-256 -196)">
    <rect width="512" height="512" fill="url(#fv-base)"/>
    <g filter="url(#fv-soft)">
      <ellipse cx="430" cy="92" rx="220" ry="176" fill="url(#fv-cyan)"/>
      <ellipse cx="62" cy="452" rx="236" ry="196" fill="url(#fv-pink)"/>
      <ellipse cx="470" cy="500" rx="170" ry="120" fill="url(#fv-cyan)" opacity=".35"/>
    </g>
    <g filter="url(#fv-haze)" opacity=".22">
      <ellipse cx="200" cy="150" rx="300" ry="34" fill="url(#fv-sheen)" transform="rotate(-28 200 150)"/>
    </g></g>
      <circle cx="256" cy="196" r="31" fill="url(#fv-dropBody)"/>
      <circle cx="256" cy="196" r="31" fill="url(#fv-dropCaustic)"/>
    </g>
    <circle cx="256" cy="196" r="30.25" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="1.5"/>
    <ellipse cx="245" cy="183" rx="9" ry="5.5" fill="#fff" opacity=".9" transform="rotate(-35 245 183)"/>
    <path d="M0 0H512V176C392 236 150 150 0 214Z" fill="url(#fv-gloss)" opacity=".5"/>
    <rect x="3" y="3" width="506" height="506" rx="113" fill="none" stroke="url(#fv-rim)" stroke-width="5"/></g>
</svg>
