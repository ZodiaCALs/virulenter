<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Virulenter"><defs>
      <radialGradient id="fv-hf" gradientUnits="userSpaceOnUse" cx="256" cy="200" r="400">
        <stop offset="0" stop-color="#0E3D29"/><stop offset=".55" stop-color="#062016"/><stop offset="1" stop-color="#020A06"/>
      </radialGradient>
      <radialGradient id="fv-hl" gradientUnits="userSpaceOnUse" cx="330" cy="340" r="260">
        <stop offset="0" stop-color="#1FB86E" stop-opacity=".42"/><stop offset="1" stop-color="#1FB86E" stop-opacity="0"/>
      </radialGradient>
    </defs><defs><clipPath id="fv-clip"><rect width="512" height="512" rx="112"/></clipPath></defs>
      <g clip-path="url(#fv-clip)">
    
    <rect x="-256" y="-256" width="1024" height="1024" fill="url(#fv-hf)"/>
    <rect x="-256" y="-256" width="1024" height="1024" fill="url(#fv-hl)"/>
    <defs>
      <filter id="fv-hbloom" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="18"/></filter>
      
      <linearGradient id="fv-ht1" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#C2FFDD" stop-opacity="0.07"/><stop offset="1" stop-color="#2FD583" stop-opacity="0.05"/>
      </linearGradient>
      <linearGradient id="fv-ht2" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#C2FFDD" stop-opacity="0.13"/><stop offset="1" stop-color="#2FD583" stop-opacity="0.12"/>
      </linearGradient>
      <linearGradient id="fv-ht3" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#C2FFDD" stop-opacity="0.22"/><stop offset="1" stop-color="#2FD583" stop-opacity="0.25"/>
      </linearGradient>
      <linearGradient id="fv-ht4" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#7CFFB5" stop-opacity="0.34"/><stop offset="1" stop-color="#2FD583" stop-opacity="0.44"/>
      </linearGradient>
      <linearGradient id="fv-ht5" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#7CFFB5" stop-opacity="0.52"/><stop offset="1" stop-color="#2FD583" stop-opacity="0.66"/>
      </linearGradient>
      <linearGradient id="fv-htdisc" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#2FD583" stop-opacity="0.74"/><stop offset="1" stop-color="#0A6B3F" stop-opacity="0.9"/>
      </linearGradient>
      <linearGradient id="fv-hrim" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#fff" stop-opacity=".5"/><stop offset=".4" stop-color="#fff" stop-opacity=".1"/>
        <stop offset=".75" stop-color="#fff" stop-opacity=".05"/><stop offset="1" stop-color="#7CFFB5" stop-opacity=".32"/>
      </linearGradient>
    </defs>
    <!-- the light the hot panes and the plus give off, on the field behind -->
    <g filter="url(#fv-hbloom)">
      <rect x="320" y="100" width="92" height="92" rx="26" fill="#2FD583" fill-opacity="0.18"/><rect x="210" y="210" width="92" height="92" rx="26" fill="#2FD583" fill-opacity="0.18"/><rect x="320" y="210" width="92" height="92" rx="26" fill="#2FD583" fill-opacity="0.36"/><rect x="100" y="320" width="92" height="92" rx="26" fill="#2FD583" fill-opacity="0.18"/><rect x="210" y="320" width="92" height="92" rx="26" fill="#2FD583" fill-opacity="0.54"/>
      <circle cx="366" cy="366" r="56" fill="#7CFFB5" fill-opacity=".5"/>
    </g>
    <!-- thin sheets of glass: a smooth tint and a hairline edge -->
    <rect x="100" y="100" width="92" height="92" rx="26" fill="url(#fv-ht1)"/><rect x="210" y="100" width="92" height="92" rx="26" fill="url(#fv-ht2)"/><rect x="320" y="100" width="92" height="92" rx="26" fill="url(#fv-ht3)"/><rect x="100" y="210" width="92" height="92" rx="26" fill="url(#fv-ht2)"/><rect x="210" y="210" width="92" height="92" rx="26" fill="url(#fv-ht3)"/><rect x="320" y="210" width="92" height="92" rx="26" fill="url(#fv-ht4)"/><rect x="100" y="320" width="92" height="92" rx="26" fill="url(#fv-ht3)"/><rect x="210" y="320" width="92" height="92" rx="26" fill="url(#fv-ht5)"/>
    <circle cx="366" cy="366" r="50" fill="url(#fv-htdisc)"/>
    <rect x="100.65" y="100.65" width="90.7" height="90.7" rx="25.35" fill="none" stroke="url(#fv-hrim)" stroke-width="1.3"/><rect x="210.65" y="100.65" width="90.7" height="90.7" rx="25.35" fill="none" stroke="url(#fv-hrim)" stroke-width="1.3"/><rect x="320.65" y="100.65" width="90.7" height="90.7" rx="25.35" fill="none" stroke="url(#fv-hrim)" stroke-width="1.3"/><rect x="100.65" y="210.65" width="90.7" height="90.7" rx="25.35" fill="none" stroke="url(#fv-hrim)" stroke-width="1.3"/><rect x="210.65" y="210.65" width="90.7" height="90.7" rx="25.35" fill="none" stroke="url(#fv-hrim)" stroke-width="1.3"/><rect x="320.65" y="210.65" width="90.7" height="90.7" rx="25.35" fill="none" stroke="url(#fv-hrim)" stroke-width="1.3"/><rect x="100.65" y="320.65" width="90.7" height="90.7" rx="25.35" fill="none" stroke="url(#fv-hrim)" stroke-width="1.3"/><rect x="210.65" y="320.65" width="90.7" height="90.7" rx="25.35" fill="none" stroke="url(#fv-hrim)" stroke-width="1.3"/>
    <circle cx="366" cy="366" r="49.35" fill="none" stroke="url(#fv-hrim)" stroke-width="1.3"/>
    <g fill="#fff"><rect x="345" y="360.5" width="42" height="11" rx="5.5"/><rect x="360.5" y="345" width="11" height="42" rx="5.5"/></g>
    <!-- a fine HUD ring round the plus, slim brackets round the grid -->
    <g fill="none" stroke="#7CFFB5" stroke-linecap="round" stroke-width="1.8">
      <path d="M416.79 330.44A62 62 0 1 1 309.81 339.8" stroke-opacity=".5"/>
      <path d="M319.93 324.51A62 62 0 0 1 397 312.31" stroke-opacity=".24"/>
    </g>
    <g fill="none" stroke="#7CFFB5" stroke-opacity=".42" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M84 106V84H106"/><path d="M428 106V84H406"/><path d="M84 406V428H106"/>
    </g></g></svg>
