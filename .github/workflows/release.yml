# Publishes a Virulenter release: builds every file (build.yml), then creates
# the GitHub Release v<version> with all of them attached, described by
# RELEASE_NOTES.md. The version is read from
# native/composeApp/src/commonMain/kotlin/com/virulenter/Version.kt.
#
# Two ways to start it:
#   - on GitHub: Actions › Release › Run workflow (tags the commit for you)
#   - or push a matching tag:  git tag v2.0.0  then  git push origin v2.0.0
#
# For the next release, raise APP_VERSION and APP_VERSION_CODE in Version.kt
# and update RELEASE_NOTES.md first.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version:
    name: Read the version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: read
        name: Check it against the tag
        run: |
          version=$(sed -n 's/.*APP_VERSION = "\(.*\)".*/\1/p' native/composeApp/src/commonMain/kotlin/com/virulenter/Version.kt)
          if [ -z "$version" ]; then
            echo "::error::No APP_VERSION found in Version.kt"; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Releasing Virulenter $version"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::The tag $GITHUB_REF_NAME does not match APP_VERSION $version in Version.kt"; exit 1
          fi
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null; then
            echo "::error::v$version is already released. Raise APP_VERSION and APP_VERSION_CODE in Version.kt first."; exit 1
          fi

  build:
    name: Build
    needs: version
    uses: ./.github/workflows/build.yml

  publish:
    name: Publish v${{ needs.version.outputs.version }}
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: Virulenter ${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          body_path: RELEASE_NOTES.md
          files: out/*
          fail_on_unmatched_files: true
